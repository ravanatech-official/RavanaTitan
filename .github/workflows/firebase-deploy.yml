name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Production Assets
        run: npm run build
        env:
          VITE_APP_NAME: "RavanaTitan Foundation Model"
          VITE_MODEL_NAME: "RavanaTitan-MoE-314B"

      # Primary deployment method: Official Google Firebase Action with Service Account
      - name: Deploy to Firebase Hosting (Service Account)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT_ID || "ravanatitaan" }}'

      # Alternative deployment method: Using FIREBASE_TOKEN (firebase login:ci)
      - name: Deploy to Firebase Hosting (CLI Token)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT == '' && secrets.FIREBASE_TOKEN != '' }}"
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'ravanatitaan' }}
