name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Production Assets
        run: npm run build
        env:
          VITE_APP_NAME: "RavanaTitan Foundation Model"
          VITE_MODEL_NAME: "RavanaTitan-MoE-314B"
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Firebase Hosting
        run: |
          SA="${FIREBASE_SERVICE_ACCOUNT:-$FIREBASE_SERVICE_ACCOUNT_RAVANATITAAN}"
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying to Firebase Hosting via FIREBASE_TOKEN..."
            npx firebase-tools deploy --only hosting --project ravanatitaan --token "$FIREBASE_TOKEN"
          elif [ -n "$SA" ]; then
            echo "Deploying to Firebase Hosting via Service Account..."
            echo "$SA" > /tmp/sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
            npx firebase-tools deploy --only hosting --project ravanatitaan
          else
            echo "::error::Neither FIREBASE_TOKEN nor FIREBASE_SERVICE_ACCOUNT secret is found in GitHub Secrets."
            echo "Please add FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_RAVANATITAAN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATITAAN }}
